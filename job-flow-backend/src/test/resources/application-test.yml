spring:
  datasource:
    hikari:
      # Spring keeps one app context per distinct test config alive, all on the same
      # MySQL. At the production size (20) a handful of them would pass MySQL's 151
      # connection limit. 5 still covers the 4-thread concurrency tests.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  mail:
    host: localhost
    port: 25
    # Keep a developer's real MAIL_* from .env out of tests; reminders use a mocked sender
    username: ""
    password: ""

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

app:
  # application.yml also reads the developer's .env; never let real OAuth credentials
  # leak into tests. Tests that need a provider set fake ones with @TestPropertySource.
  oauth:
    google:
      client-id: ""
      client-secret: ""
    github:
      client-id: ""
      client-secret: ""
  jwt:
    secret: testSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmInTests
    expiration-ms: 3600000
  # Jobs firing mid-test would hit a database that's being wiped (see SchedulingConfig)
  scheduling:
    enabled: false
