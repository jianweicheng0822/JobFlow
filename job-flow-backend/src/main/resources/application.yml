server:
  port: 8080
  # Let Tomcat turn X-Forwarded-For/Proto into the real client IP and scheme, but only
  # for requests coming from a trusted proxy. TRUSTED_PROXIES is a regex of proxy IPs
  # (e.g. the Docker network nginx runs on). Empty = trust nobody, so clients can't
  # spoof their IP with that header, which the rate limiter relies on.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:}

spring:
  application:
    name: jobflow

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/jobflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Default is 10. Load testing showed 190 of 200 request threads stuck waiting
      # for a connection at 80 it/s. Bigger isn't always better: past ~2x the DB's
      # cores, MySQL itself starts to slow down.
      maximum-pool-size: 20

  jpa:
    # Off so a request only holds a DB connection while a service method runs,
    # not until the response is fully written. Services open their own transactions.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile, https://www.googleapis.com/auth/gmail.readonly
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email, read:user
        # LinkedIn - uncomment when credentials are available
        # linkedin:
        #   client-id: ${LINKEDIN_CLIENT_ID}
        #   client-secret: ${LINKEDIN_CLIENT_SECRET}
        #   authorization-grant-type: authorization_code
        #   redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        #   scope: openid, profile, email
        #   client-name: LinkedIn
        # provider:
        #   linkedin:
        #     authorization-uri: https://www.linkedin.com/oauth/v2/authorization
        #     token-uri: https://www.linkedin.com/oauth/v2/accessToken
        #     user-info-uri: https://api.linkedin.com/v2/userinfo
        #     user-name-attribute: sub

app:
  # Where users open the app. OAuth and Gmail linking send the browser back here,
  # and it's the only origin allowed to call the API cross-origin.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  gmail:
    # Must match a redirect URI registered for the Google OAuth client
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  # Seeds a demo account (demo@jobflow.com / demo123) with sample data on startup.
  # Local demos only: anyone who knows the password can log in.
  seed-demo-data: ${SEED_DEMO_DATA:false}
