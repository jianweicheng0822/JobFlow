server:
  port: 8080

spring:
  application:
    name: jobflow

  datasource:
    url: jdbc:mysql://localhost:3306/jobflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: aa715443

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile, https://www.googleapis.com/auth/gmail.readonly
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email, read:user
        # LinkedIn - uncomment when credentials are available
        # linkedin:
        #   client-id: ${LINKEDIN_CLIENT_ID}
        #   client-secret: ${LINKEDIN_CLIENT_SECRET}
        #   authorization-grant-type: authorization_code
        #   redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        #   scope: openid, profile, email
        #   client-name: LinkedIn
        # provider:
        #   linkedin:
        #     authorization-uri: https://www.linkedin.com/oauth/v2/authorization
        #     token-uri: https://www.linkedin.com/oauth/v2/accessToken
        #     user-info-uri: https://api.linkedin.com/v2/userinfo
        #     user-name-attribute: sub

app:
  jwt:
    secret: ${JWT_SECRET:myDefaultSuperSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
    expiration-ms: 86400000
