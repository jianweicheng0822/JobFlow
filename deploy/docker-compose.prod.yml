# Production stack for one small server (1 GB RAM + 2 GB swap) behind Cloudflare.
# Images are built by CI and pulled from GHCR; the server never compiles anything.
#
# Lives in /opt/jobflow next to nginx.prod.conf, certs/ (Cloudflare origin cert) and
# .env (see .env.example for the variables, plus MYSQL_ROOT_PASSWORD). DB_USERNAME is
# the app's own MySQL user here, so it can't be root. FRONTEND_URL is the public
# https:// address.
#
#   docker compose -f docker-compose.prod.yml up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      # performance_schema alone takes ~200 MB, more than this box can spare
      - --performance-schema=OFF
      - --max-connections=40
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jobflow
      # The app's own login, with rights on the jobflow database only (created on first start)
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # No ports: only the backend reaches MySQL, over the compose network
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 400m

  backend:
    image: ghcr.io/jianweicheng0822/jobflow-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Anyone could log in to the demo account, so never on a public server
      SEED_DEMO_DATA: "false"
      FRONTEND_URL: ${FRONTEND_URL}
      GMAIL_REDIRECT_URI: ${FRONTEND_URL}/api/gmail/callback
      # nginx on the compose network (172.16.0.0/12)
      TRUSTED_PROXIES: '172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'
      # Every SQL statement in the log would fill the disk and slow requests down
      SPRING_JPA_SHOW_SQL: "false"
      # 20 is sized for load tests; 10 is plenty here and keeps MySQL's memory down
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "10"
      # Heap capped well under mem_limit to leave room for metaspace and threads.
      # SerialGC has the smallest footprint, and pauses don't matter at this size.
      JAVA_TOOL_OPTIONS: -Xmx320m -XX:+UseSerialGC -Xss512k
    mem_limit: 512m

  frontend:
    image: ghcr.io/jianweicheng0822/jobflow-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # HTTPS only: Cloudflare redirects http to https before it gets here.
      # The AWS security group only lets Cloudflare's IPs in.
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 64m

volumes:
  mysql_data:
