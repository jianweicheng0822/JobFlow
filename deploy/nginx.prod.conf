# Production nginx: HTTPS with the Cloudflare origin certificate, behind Cloudflare's proxy.
# Mounted over the image's default.conf by docker-compose.prod.yml.

# Every request comes from a Cloudflare server, so take the visitor's IP from the header
# Cloudflare sets, but only when the request really is from Cloudflare. Without this the
# backend's rate limiter would see a handful of Cloudflare IPs and lump everyone together.
# List from https://www.cloudflare.com/ips-v4 (the server only has an IPv4 address).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/jobflow-origin.pem;
    ssl_certificate_key /etc/nginx/certs/jobflow-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in headers and error pages
    server_tokens off;

    # Security headers. They live here at server level only: a location with its own
    # add_header stops inheriting all of these, so caching below uses "expires" instead.
    # CSP: everything comes from this origin. Images also allow data: (uploaded avatars)
    # and https: (Google/GitHub profile pictures). Inline styles are allowed because
    # React and recharts set style attributes; scripts are not.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HTTPS only from here on; no includeSubDomains since other lumis.software hosts aren't ours to decide
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA routing: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html names the current bundle, so the browser has to check it on every load
        # (a negative expires sends Cache-Control: no-cache)
        expires -1;
    }

    # Vite puts a content hash in these file names, so they can be cached for good
    location /assets/ {
        expires 1y;
    }

    # API, OAuth start and OAuth callback all go to the backend unchanged.
    # X-Forwarded-For is the visitor (after real_ip above), set rather than appended
    # so nobody can sneak their own value in front. Proto and port are fixed: visitors
    # always reach the site on https://<domain>, and Spring builds OAuth redirect URLs
    # from these.
    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
}
