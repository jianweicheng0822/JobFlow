<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobFlow</title>
    <meta name="description" content="Track your job applications, interviews and offers in one place." />
    <script>
      // Apply the saved theme before the first paint so dark mode doesn't flash
      // white on reload. Same key as src/utils/theme.ts.
      try {
        if (localStorage.getItem('jobflow-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
