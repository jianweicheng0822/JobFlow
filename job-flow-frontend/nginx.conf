# The port the browser used (from Host), so the backend builds URLs with it. Without
# it, X-Forwarded-Proto makes Tomcat assume the scheme's default port.
map $http_host $forwarded_port {
    "~:(?<port>\d+)$" $port;
    default          80;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # X-Forwarded-For is set to the client nginx sees, not appended to, so a
    # client can't sneak its own value in front (the backend rate limits by it).
    # Host uses $http_host to keep the port: Spring builds OAuth redirect URLs from it
    # and compares it with the browser's Origin, and $host drops it.

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # Proxy OAuth2 authorization requests
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # Proxy OAuth2 callback requests
    location /login/oauth2/ {
        proxy_pass http://backend:8080/login/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }
}
