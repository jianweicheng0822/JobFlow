services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: jobflow
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: on first start MySQL runs a temporary init server that only
      # listens on the socket, and pinging "localhost" (socket) reported healthy too early
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./job-flow-backend
    ports:
      # Localhost only: outside traffic has to come through nginx
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Optional ones get a default so leaving them out of .env still starts the app.
      # Spring refuses an empty OAuth client id, hence "placeholder" (same as application.yml).
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Change both if the app isn't served at http://localhost (e.g. another port or a domain)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost/api/gmail/callback}
      # Regex of proxy IPs whose X-Forwarded-For we trust: nginx on the Docker network (172.16.0.0/12)
      TRUSTED_PROXIES: '172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}'

  frontend:
    build: ./job-flow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
